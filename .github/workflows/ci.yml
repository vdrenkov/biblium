name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Check runtime dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.76.2
          scan-type: rootfs
          scan-ref: target
          scanners: vuln
          exit-code: '1'
